services:
  - type: web
    name: ai-news-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: "5000"
      - key: NODE_ENV
        value: production
      - key: DB_PROVIDER
        value: postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: ai-news-db
          property: connectionString
      - key: ADMIN_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: CURRENTS_API_KEY
        sync: false

databases:
  - name: ai-news-db
    plan: free
    postgresMajorVersion: "15"
